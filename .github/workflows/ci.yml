name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: TypeScript core, simulator & desktop UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:core
      - run: npx tsc --noEmit -p packages/core
      - run: npx tsc --noEmit -p tools/simulator
      - run: npm run build -w @vanepoint/desktop

  rust:
    name: Rust tests, clippy & end-to-end
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build -w @vanepoint/desktop
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude vanepoint-desktop
      - name: End-to-end (real agent vs phone simulator, dry-run)
        run: node tools/e2e/run.mjs

  mobile:
    name: Mobile typecheck & bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform android --output-dir ${{ runner.temp }}/expo-export
