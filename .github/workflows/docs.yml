name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.md"
      - "profiles/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path node_modules --exclude "github.com/vanepoint-hq" "**/*.md"
          fail: true

  profiles:
    name: Validate app profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes ajv-cli@5 validate --spec=draft2020 -s profiles/schema/profile.schema.json -d "profiles/*.json"
